name: Verify Repo Map Up to Date

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Repository Map
        run: |
          python tools/generate_map.py

      - name: Verify Map is Up to Date
        run: |
          git diff --exit-code docs/map.json
